<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1930"><link rel="manifest" href="/manifest.json"><title>LumiGo · Demo funcional</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#e9f5ff;background:#09192e;font-size:15px}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}.app{max-width:1080px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{font-size:29px;font-weight:850;letter-spacing:-1px}.brand b{color:#c9f768}.small{font-size:12px;color:#aac0d2}.tag{background:#27405b;color:#d4ff9e;border-radius:30px;padding:8px 11px;font-size:12px}.layout{display:grid;grid-template-columns:220px 1fr;gap:18px}.card,.nav{background:#112b45;border:1px solid #2d465e;border-radius:16px;padding:20px;margin-bottom:14px}.nav{height:max-content;display:grid;gap:6px}.nav button{text-align:left}.btn,.nav button{background:#1b3651;border:1px solid #3b5771;color:#f0f7fd;padding:10px 14px;border-radius:10px}.btn:hover,.nav button:hover{border-color:#c9f768}.primary,.nav button.on{background:#c9f768;color:#102638;border-color:#c9f768;font-weight:750}.danger{background:#662e3a}.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.hero{background:linear-gradient(120deg,#154d5b,#173554)}h1{font-size:25px}h2{font-size:20px;margin:0 0 15px}h3{font-size:16px;margin:0 0 8px}p{line-height:1.55}.balance{font-size:34px;color:#c9f768;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:14px;border:1px solid #3a5166;border-radius:12px}.stat strong{font-size:24px;display:block;margin-top:6px}.item{border-bottom:1px solid #334c63;padding:13px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.item:last-child{border:0}.item-left{display:flex;gap:10px;align-items:center}.emoji{font-size:29px}.field{display:grid;gap:7px;margin:14px 0}input,select{width:100%;border:1px solid #527087;background:#0b2138;color:#f4fbff;border-radius:10px;padding:11px}label{color:#bdd3e2;font-size:13px}.ok,.err{border-radius:10px;padding:13px;margin-bottom:12px;background:#204e40;color:#c7ffdf}.err{background:#61333d;color:#ffe0dc}.qr{width:235px;max-width:100%;display:block;margin:15px auto;border:12px solid white;border-radius:10px}.code{word-break:break-all;background:#0b2138;padding:12px;border-radius:9px;font-weight:800;letter-spacing:1px;text-align:center}.hint{font-size:12px;color:#afc4d5}.pill{border:1px solid #638a77;border-radius:14px;color:#c9f768;padding:4px 9px;font-size:12px}.hide{display:none}a{color:#c9f768}@media(max-width:620px){.app{padding:12px}.layout{display:block}.nav{display:flex;overflow-x:auto;gap:6px;padding:10px}.nav button{white-space:nowrap}.card{padding:16px}.brand{font-size:24px}.top{margin-bottom:10px}}
</style></head><body><div class="app"><header class="top"><div><div class="brand">✦ Lumi<b>Go</b></div><div class="small">Tu dinero se mueve contigo</div></div><div class="tag">DEMO · Sin pagos reales</div></header><div id="alert"></div><div id="auth"></div><div class="layout hide" id="app"><nav class="nav" id="nav"></nav><main id="main"></main></div><footer class="small">LumiGo prototipo local · El saldo de puntos y los cobros QR son ficticios. No usar para operar dinero real.</footer></div>
<script>
let token=sessionStorage.getItem('lumigo_token')||'',me=null,page='Inicio',stores=[],products=[],charges=[],movements=[],cart=[];const $=id=>document.getElementById(id),money=n=>'$'+Number(n).toLocaleString('es-CO'),escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const r=await fetch('/api'+path,{method:body===undefined?'GET':'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body===undefined?{}:{body:JSON.stringify(body)})});const val=await r.json();if(!r.ok)throw Error(val.error||'Error de conexión');return val}
function message(s,bad=false){$('alert').innerHTML=`<div class="${bad?'err':'ok'}">${escapeHTML(s)}</div>`;setTimeout(()=>{if($('alert'))$('alert').textContent=''},6500)}
async function action(fn){try{await fn()}catch(e){message(e.message,true)}}
function panel(s,extra=''){return `<section class="card ${extra}">${s}</section>`};function btn(label,action,cls=''){return `<button class="btn ${cls}" data-action="${action}">${label}</button>`};function row(title,detail,buttons=''){return `<div class="item"><div><strong>${escapeHTML(title)}</strong><div class="small">${detail}</div></div><div>${buttons}</div></div>`}
function authView(){ $('app').classList.add('hide');$('auth').innerHTML=panel(`<h2>Bienvenido a LumiGo</h2><p class="small">Inicia sesión con una cuenta demo o registra tu propio usuario de pruebas.</p><form id="login"><div class="field"><label>Correo</label><input name="email" type="email" required value="usuario@lumigo.demo"></div><div class="field"><label>Contraseña</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn primary">Ingresar</button></form><hr style="border:0;border-top:1px solid #3b5166;margin:20px 0"><h3>Crear usuario</h3><form id="register"><div class="field"><label>Nombre</label><input name="name" required minlength="2"></div><div class="field"><label>Correo</label><input name="email" type="email" required></div><div class="field"><label>Contraseña (mínimo 10 caracteres)</label><input name="password" type="password" minlength="10" required></div><button class="btn">Crear cuenta</button></form><p class="small">Solicita al responsable tus credenciales privadas de prueba.</p>`)}
async function reload(){me=await api('/me');products=(await api('/products')).items;stores=(await api('/stores')).items;movements=(await api('/movements')).items;charges=(await api('/charges')).items;render()}
const menus={user:['Inicio','Recargar','Comprar','Carrito','Pagar QR','Historial','Lumi IA'],merchant:['Inicio','Cobrar QR','Ventas','Productos'],operator:['Inicio','Operaciones'],admin:['Inicio','Operaciones','Comercios']};
function render(){if(!me)return authView();$('auth').innerHTML='';$('app').classList.remove('hide');let menu=menus[me.role];if(!menu.includes(page))page='Inicio';$('nav').innerHTML=menu.map(x=>`<button class="${x===page?'on':''}" data-page="${x}">${x}</button>`).join('')+'<button data-action="logout">Salir</button>';
let out='';const bal=panel(`<div class="small">${escapeHTML(me.name)} · ${escapeHTML(me.role)}</div><div class="small" style="margin-top:14px">Mis LumiPoints de prueba</div><div class="balance">${me.points.toLocaleString('es-CO')} ✦</div><div class="small">No equivale a depósitos ni dinero retirable</div>`, 'hero');
if(me.role==='user'){
if(page==='Inicio')out=bal+panel(`<h3>Comienza a utilizar LumiGo</h3><div class="actions">${btn('Recargar puntos','goto:Recargar','primary')}${btn('Explorar productos','goto:Comprar')}${btn('Pagar QR','goto:Pagar QR')}${btn('Mis operaciones','goto:Historial')}</div>`);
if(page==='Recargar')out=bal+panel(`<h2>Recarga simulada</h2><p class="small">No contactaremos a Nequi, DaviPlata, PSE ni a ninguna pasarela. Sólo crea puntos ficticios.</p><form id="recharge"><div class="field"><label>Valor COP</label><select name="amount">${[10000,20000,50000,100000].map(v=>`<option value="${v}">${money(v)}</option>`).join('')}</select></div><div class="field"><label>Método simulado</label><select name="method">${['Nequi','DaviPlata','PSE','Tarjeta'].map(v=>`<option>${v}</option>`).join('')}</select></div><button class="btn primary">Confirmar recarga de prueba</button></form>`);
if(page==='Comprar')out=panel(`<h2>Marketplace</h2>${products.map(p=>`<div class="item"><div class="item-left"><div class="emoji">${escapeHTML(p.icon)}</div><div><strong>${escapeHTML(p.name)}</strong><div class="small">${escapeHTML(p.store_name)} · ${p.stock} disponibles</div><strong>${money(p.price)}</strong></div></div>${btn('Agregar','add:'+p.id,p.stock?'':'')}</div>`).join('')}`);
if(page==='Carrito'){let pr=cart.map(id=>products.find(x=>x.id===id)).filter(Boolean),total=pr.reduce((n,p)=>n+p.price,0);out=panel(`<h2>Carrito (${cart.length})</h2>${pr.map((p,i)=>row(p.name,money(p.price),btn('Quitar','remove:'+i))).join('')}<h3>Total: ${money(total)}</h3><p class="small">Para proteger el inventario, cada compra se confirma individualmente.</p>${pr.length?btn('Comprar primer producto','buy:'+pr[0].id,'primary'):'<p>Tu carrito está vacío.</p>'}`)}
if(page==='Pagar QR')out=bal+panel(`<h2>Pagar código QR</h2><p class="small">Escanea un QR del comercio con la cámara del celular o copia su código. El cobro debe existir previamente.</p><div class="actions">${btn('Abrir cámara','scan')}</div><div class="field"><label>Referencia QR</label><input id="code" placeholder="LG-XXXXXXXXXXXXXX"></div>${btn('Buscar solicitud','lookup','primary')}<div id="charge-details"></div><div id="reader" class="hide" style="margin-top:12px"><video id="video" autoplay playsinline muted style="width:100%;max-width:350px;border-radius:10px"></video><p class="small">La cámara solo funciona en localhost o HTTPS y navegadores compatibles.</p>${btn('Cerrar cámara','stopscan')}</div>`);
if(page==='Historial')out=panel(`<h2>Movimientos</h2>${movements.map(m=>row(m.kind,m.reference+' · '+new Date(m.created*1000).toLocaleString('es-CO'),`<strong style="color:${m.delta>=0?'#c9f768':'#fff'}">${m.delta>0?'+':''}${m.delta.toLocaleString('es-CO')} ✦</strong>`)).join('')||'<p>Sin movimientos</p>'}`);
if(page==='Lumi IA')out=panel(`<h2>Lumi IA · Presupuesto educativo</h2><p class="small">Herramienta de reglas, no asesoría personalizada de inversión.</p><form id="budget"><div class="field"><label>Ingresos COP</label><input name="income" type="number" value="2500000" min="0"></div><div class="field"><label>Gastos COP</label><input name="expenses" type="number" value="1600000" min="0"></div><div class="field"><label>Meta ahorro COP</label><input name="goal" type="number" value="300000" min="0"></div><button class="btn primary">Calcular</button></form><div id="budget-result"></div>`);
}
if(me.role==='merchant'){
let owned=charges;let store=stores.find(s=>s.id===owned[0]?.store_id)||{name:'Mi comercio'};
if(page==='Inicio')out=panel(`<h2>Panel de comercio</h2><div class="grid"><div class="stat">Solicitudes QR<strong>${owned.length}</strong></div><div class="stat">Cobros confirmados<strong>${owned.filter(c=>c.state==='paid').length}</strong></div></div><div class="actions">${btn('Generar cobro QR','goto:Cobrar QR','primary')}${btn('Ver ventas','goto:Ventas')}</div>`);
if(page==='Cobrar QR')out=panel(`<h2>Generar cobro QR</h2><form id="charge"><div class="field"><label>Importe en LumiPoints</label><input name="amount" type="number" min="100" max="2000000" value="15000" required></div><button class="btn primary">Crear solicitud de pago</button></form>`)+panel(`<h3>Códigos generados</h3>${owned.map(c=>`<div class="item"><div><strong>${money(c.amount)}</strong><div class="small">${escapeHTML(c.code)} · ${c.state==='paid'?'Pagado':'Pendiente'}</div></div>${btn('Ver QR','showqr:'+c.code)}</div>`).join('')}`)+`<div id="qr-result"></div>`;
if(page==='Ventas')out=panel(`<h2>Ventas QR</h2>${owned.map(c=>row(c.code,`Pagador: ${escapeHTML(c.payer_name||'Sin confirmar')} · ${c.state}`,money(c.amount))).join('')||'<p>Sin ventas</p>'}`);
if(page==='Productos')out=panel(`<h2>Productos de la plataforma</h2>${products.map(p=>row(p.name,escapeHTML(p.store_name),money(p.price))).join('')}<h3 style="margin-top:16px">Agregar producto a tu comercio</h3><form id="product"><div class="field"><label>Nombre</label><input name="name" required minlength="2"></div><div class="field"><label>Precio</label><input name="price" type="number" min="100" required></div><div class="field"><label>Stock</label><input name="stock" type="number" min="0" required></div><button class="btn primary">Agregar</button></form>`);
}
if(['operator','admin'].includes(me.role)){
if(page==='Inicio')out=panel(`<h2>Control ${me.role==='admin'?'administrativo':'operativo'}</h2><div id="metrics" class="grid">Cargando...</div>`);
if(page==='Operaciones')out=panel(`<h2>Supervisión de cobros QR</h2>${charges.map(c=>row(c.code,escapeHTML(c.store_name)+' · '+c.state+' · '+escapeHTML(c.payer_name||'Sin pagador'),money(c.amount))).join('')||'Sin operaciones'}`);
if(page==='Comercios'&&me.role==='admin')out=panel(`<h2>Comercios</h2>${stores.map(s=>row(s.name,s.active?'Activo':'Suspendido',btn(s.active?'Suspender':'Activar','store:'+s.id+':'+(!s.active)))).join('')}`);
}
$('main').innerHTML=out;if(page==='Inicio'&&['admin','operator'].includes(me.role))action(async()=>{let d=await api('/dashboard');$('metrics').innerHTML=Object.entries({Usuarios:d.users,Comercios:d.stores,'Puntos recargados (demo)':d.recharges,'QR pagados':d.qr_paid}).map(([k,v])=>`<div class="stat">${k}<strong>${Number(v).toLocaleString('es-CO')}</strong></div>`).join('')});
}
let scannerStream=null,scannerTimer=null;async function stopscan(){if(scannerTimer)clearInterval(scannerTimer);scannerTimer=null;if(scannerStream)scannerStream.getTracks().forEach(t=>t.stop());scannerStream=null;let rd=$('reader');if(rd)rd.classList.add('hide')}
async function scan(){if(!('BarcodeDetector' in window)||!navigator.mediaDevices?.getUserMedia)throw Error('Tu navegador no permite leer QR automáticamente. Copia el código del comercio.');await stopscan();scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('reader').classList.remove('hide');$('video').srcObject=scannerStream;let detector=new BarcodeDetector({formats:['qr_code']});scannerTimer=setInterval(async()=>{try{if(!$('video')||$('video').readyState<2)return;let results=await detector.detect($('video'));if(results.length){const value=results[0].rawValue; $('code').value=value.replace(/^LUMIGO-DEMO:/,'');await stopscan();message('QR leído. Revisa el cobro antes de autorizarlo.');}}catch(e){}},450)}
async function lookup(){let code=$('code').value.trim().toUpperCase().replace(/^LUMIGO-DEMO:/,'');let storeCharges=await api('/charges');let c=storeCharges.items.find(x=>x.code===code);if(!c){ // Need public lookup, authenticated endpoint handled separately below
let r=await api('/lookup?code='+encodeURIComponent(code));c=r.charge;
}if(!c)throw Error('Cobro inexistente');$('charge-details').innerHTML=panel(`<h3>${escapeHTML(c.store_name)}</h3><p>Importe: <strong>${money(c.amount)}</strong></p><p>Estado: ${escapeHTML(c.state)}</p><p>Saldo después: ${money(me.points-c.amount)}</p>${c.state==='pending'?btn('Autorizar pago','pay:'+c.code,'primary'):'<p>Solicitud ya pagada</p>'}`)}
async function command(a){if(a.startsWith('goto:')){await stopscan();page=a.slice(5);render();return}if(a==='logout'){await stopscan();await api('/logout',{});token='';me=null;sessionStorage.removeItem('lumigo_token');authView();return}if(a.startsWith('add:')){cart.push(Number(a.slice(4)));message('Producto añadido');render();return}if(a.startsWith('remove:')){cart.splice(Number(a.slice(7)),1);render();return}if(a.startsWith('buy:')){let p=products.find(p=>p.id===Number(a.slice(4)));if(!confirm('Comprar '+p.name+' por '+money(p.price)+' puntos ficticios?'))return;await api('/buy',{product_id:p.id});cart.shift();await reload();page='Historial';render();message('Compra simulada confirmada');return}if(a==='lookup')return lookup();if(a==='scan')return scan();if(a==='stopscan')return stopscan();if(a.startsWith('pay:')){let code=a.slice(4);if(!confirm('¿Confirmar pago QR con puntos ficticios?'))return;await api('/pay-qr',{code});await reload();page='Historial';render();message('Pago QR aprobado. Se impiden cobros duplicados.');return}if(a.startsWith('showqr:')){let code=a.slice(7);$('qr-result').innerHTML=panel(`<h3>QR de prueba</h3><img class="qr" alt="Código QR escaneable de demo" src="/api/qr/${encodeURIComponent(code)}"><div class="code">${escapeHTML(code)}</div><p class="hint">Solicita al usuario que abra Pagar QR, lo escanee o introduzca el código.</p>`);return}if(a.startsWith('store:')){let [,id,active]=a.split(':');await api('/admin-store',{store_id:Number(id),active:active==='true'});await reload();return}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action],[data-page]');if(!b)return;action(async()=>{if(b.dataset.page){await stopscan();page=b.dataset.page;render()}else await command(b.dataset.action)})});
document.addEventListener('submit',e=>{if(!['login','register','recharge','charge','product','budget'].includes(e.target.id))return;e.preventDefault();let f=e.target,id=f.id,d=Object.fromEntries(new FormData(f));action(async()=>{if(id==='login'){let r=await api('/login',d);token=r.token;sessionStorage.setItem('lumigo_token',token);page='Inicio';await reload();message('Sesión iniciada')}if(id==='register'){await api('/register',d);message('Cuenta creada. Inicia sesión con tus credenciales.')}if(id==='recharge'){let r=await api('/recharge-demo',{amount:Number(d.amount),method:d.method});await reload();message(r.message)}if(id==='charge'){let r=await api('/charge',{amount:Number(d.amount)});await reload();page='Cobrar QR';render();await command('showqr:'+r.code);message('Cobro generado')}if(id==='product'){await api('/product',{name:d.name,price:Number(d.price),stock:Number(d.stock)});await reload();message('Producto creado')}if(id==='budget'){let v=Number(d.income)-Number(d.expenses)-Number(d.goal);$('budget-result').innerHTML=panel(`<h3>Disponible estimado: ${money(v)}</h3><p>${v<0?'Ajusta la meta de ahorro o tus gastos para evitar déficit.':'Reserva para imprevistos antes de comprometer este dinero.'}</p>`)} })});
(async()=>{if(token){try{await reload()}catch(e){token='';sessionStorage.removeItem('lumigo_token');authView()}}else authView()})();
</script></body></html>
